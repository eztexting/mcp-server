include:
  project: 'eztexting/code/dev'
  file: '/config/gitlab/claude-review.yml'
  ref: 'main'

default:
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

stages:
  - build
  - publish

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build

publish-npm:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-.+)?$/
  script:
    - |
      PKG_VERSION=$(node -p "require('./package.json').version")
      SVR_VERSION=$(node -p "require('./server.json').version")
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "tag $CI_COMMIT_TAG does not match package.json version $PKG_VERSION" >&2
        exit 1
      fi
      if [ "$SVR_VERSION" != "$TAG_VERSION" ]; then
        echo "tag $CI_COMMIT_TAG does not match server.json version $SVR_VERSION" >&2
        exit 1
      fi
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish --access public

# MCP Registry publish (https://registry.modelcontextprotocol.io) is intentionally
# manual until the namespace is DNS-verified and the auth method (gitlab-oidc vs.
# DNS challenge) is decided. After NPM publish succeeds, run locally:
#
#   npx -y @modelcontextprotocol/mcp-publisher@latest login <method>
#   npx -y @modelcontextprotocol/mcp-publisher@latest publish
